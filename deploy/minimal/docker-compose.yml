# 最小部署：复制本目录到服务器，填写 config.yaml 后执行 docker compose up -d
# 镜像需先在项目根目录构建：docker build -f build/docker/Dockerfile -t magma-viewer:latest .
services:
  magma-viewer:
    container_name: magma-viewer
    image: ghcr.io/mr-monkeyray/magma-viewer:${MAGMA_VIEWER_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./images:/data/images