# 最小化部署：把本目录复制到服务器，将 config.example.yaml 复制为 config.yaml 并修改后执行 docker compose up -d
# 需先在项目根目录构建镜像：docker build -f build/docker/Dockerfile -t magma-viewer:latest .
services:
  magma-viewer:
    image: magma-viewer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./images:/data/images
