# 安装到 /etc/nginx/conf.d/magma-viewer.conf（由 http {} 引入）。
# 替换域名、证书路径和应用地址；不依赖 Cloudflare。
limit_req_zone $binary_remote_addr zone=mv_login:10m rate=6r/m;

# 拒绝跨站 POST，包括同站其他子域名；无 Origin 的命令行请求仍需应用鉴权。
map "$http_origin|$http_host" $mv_origin_mismatch {
    default 1;
    "~^\|" 0;
    "~*^https?://([^/|]+)\|\1$" 0;
}
map "$request_method:$mv_origin_mismatch:$http_sec_fetch_site" $mv_csrf {
    default 0;
    "~^POST:1:" 1;
    "~^POST:[01]:(cross-site|same-site)$" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name viewer.example.com;
    return 301 https://viewer.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name viewer.example.com;

    ssl_certificate     /etc/nginx/magma-viewer/origin.pem;
    ssl_certificate_key /etc/nginx/magma-viewer/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # 仅在使用 Cloudflare 代理时启用；安装与更新步骤见 README.md。
    # include /etc/nginx/magma-viewer/cloudflare-realip.conf;

    if ($mv_csrf) { return 403; }
    client_max_body_size 16k;
    limit_req_status 429;

    # X-Content-Type-Options、X-Frame-Options、Referrer-Policy、CSP 由应用设置，这里不重复添加，
    # 否则浏览器会同时执行两份 CSP。

    # 统一覆盖客户端传入的代理头；不要在 location 内重新设置这些头。
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_buffering off;
    # 不启用 proxy_cache：保留应用为 API、页面和图片设置的缓存策略。

    location = /api/login {
        limit_req zone=mv_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # 页面、API、图片及 ZIP 下载均由应用处理；关闭缓冲以流式传输 ZIP。
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
