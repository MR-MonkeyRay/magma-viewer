# magma-viewer 反向代理：访客 → Cloudflare → nginx（本文件）→ magma-viewer
#
# 安装位置：/etc/nginx/conf.d/magma-viewer.conf
# 本文件包含 http 级指令（upstream / map / geo / limit_*_zone），必须在 http {} 内被 include；
# 发行版默认的 conf.d/*.conf 就在 http {} 内。sites-enabled 同理。
#
# 部署前替换：
#   viewer.example.com           站点域名（两处）
#   127.0.0.1:8080               magma-viewer 监听地址
#   /etc/nginx/magma-viewer/     证书与 Cloudflare IP 列表所在目录
# 详细步骤与 Cloudflare 面板设置见同目录 README.md。

upstream magma_viewer {
    server 127.0.0.1:8080;
    keepalive 16;
}

# ---------- 来源识别 ----------

# 连接是否来自 Cloudflare。按 TCP 对端（$realip_remote_addr）判断，不受 CF-Connecting-IP 改写影响。
geo $realip_remote_addr $mv_from_cloudflare {
    default 0;
    include /etc/nginx/magma-viewer/cloudflare-geo.conf;
}

# 管理入口（登录、状态、抓取、暂停、下载全部）的访客 IP 白名单。
# 默认不限制；只在固定网络管理时，改为 default 0 并逐行列出允许的地址或网段。
geo $mv_admin_allowed {
    default 1;
    # default 0;
    # 203.0.113.10    1;
    # 2001:db8::/48   1;
}

# ---------- 跨站请求防护 ----------
# 应用的会话 cookie 是 SameSite=Lax，同站的其他子域名仍可能伪造 POST。
# 对所有 POST：浏览器带来的 Origin 必须与 Host 一致，且 Sec-Fetch-Site 不能是 cross-site / same-site。
# 没有 Origin 的请求（curl 等非浏览器客户端）放行，管理接口仍需会话 cookie。
map "$http_origin|$http_host" $mv_origin_mismatch {
    default                       1;
    "~^\|"                        0;
    "~*^https?://([^/|]+)\|\1$"   0;
}

map "$request_method:$mv_origin_mismatch:$http_sec_fetch_site" $mv_csrf {
    default                                0;
    "~^POST:1:"                            1;
    "~^POST:[01]:(cross-site|same-site)$"  1;
}

# ---------- 限流（按真实访客 IP） ----------
limit_req_zone  $binary_remote_addr zone=mv_login:10m rate=6r/m;
limit_req_zone  $binary_remote_addr zone=mv_admin:10m rate=60r/m;
limit_req_zone  $binary_remote_addr zone=mv_api:10m   rate=5r/s;
limit_req_zone  $binary_remote_addr zone=mv_zip:10m   rate=6r/m;
limit_conn_zone $binary_remote_addr zone=mv_conn:10m;

# ---------- 拒绝未知域名与按 IP 直连 ----------
# 扫描器常直接访问源站 IP；不回应任何内容，也不在 TLS 握手中暴露证书。
# 若本机已有其他 default_server，删除这两个 server 块。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name viewer.example.com;
    # Cloudflare 开启 Always Use HTTPS 后很少走到这里。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;    # nginx < 1.25.1 删除本行，改为 listen 443 ssl http2;
    server_name viewer.example.com;
    server_tokens off;

    # Cloudflare Origin CA 证书（SSL/TLS → 源服务器 → 创建证书），配合 Full (strict) 模式。
    ssl_certificate     /etc/nginx/magma-viewer/origin.pem;
    ssl_certificate_key /etc/nginx/magma-viewer/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:mv_ssl:10m;
    ssl_session_timeout 1d;

    # 可选：Authenticated Origin Pulls，只接受携带 Cloudflare 客户端证书的 TLS 连接。
    # 证书下载：https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
    # ssl_client_certificate /etc/nginx/magma-viewer/authenticated_origin_pull_ca.pem;
    # ssl_verify_client on;

    # 真实访客 IP：仅当连接来自 Cloudflare 时采用 CF-Connecting-IP，之后 $remote_addr 即访客 IP。
    include /etc/nginx/magma-viewer/cloudflare-realip.conf;

    # 只接受经 Cloudflare 转发的请求，防止绕过 CDN / WAF 直连源站。
    if ($mv_from_cloudflare = 0) {
        return 444;
    }
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }
    if ($mv_csrf) {
        return 403;
    }

    # 应用只接收很小的 JSON 请求体。
    client_max_body_size 16k;
    limit_req_status  429;
    limit_conn_status 429;

    # 安全响应头。注意：location 内一旦出现 add_header，这里的全部 add_header 都不再继承，
    # 所以下面的 location 都不使用 add_header（缓存头由应用设置）。
    # HSTS 只在 nginx 或 Cloudflare 其中一处开启。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # 开启 Cloudflare Web Analytics 自动注入时，需在 script-src 加 https://static.cloudflareinsights.com，
    # connect-src 加 https://cloudflareinsights.com；Rocket Loader 需关闭。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Cloudflare 到客户端会再压缩；这里压缩可减少回源流量。图片本身已压缩，不在列表中。
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_types      text/css text/javascript application/javascript application/json image/svg+xml;

    # 回源请求头。location 内若出现 proxy_set_header 会丢弃这里的全部设置，所以只在此处统一设置。
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;   # 应用对本机 / 内网来源据此识别访客 IP
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;          # TLS 在这里终止；应用据此给会话 cookie 加 Secure
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    location ~ /\. {
        return 404;
    }

    # 登录：严格限流，可选白名单。
    location = /api/login {
        if ($mv_admin_allowed = 0) {
            return 403;
        }
        limit_req zone=mv_login burst=5 nodelay;
        proxy_pass http://magma_viewer;
    }

    # 管理接口：应用校验会话 cookie，这里额外限流和可选白名单。
    location ~ ^/api/(status|fetch|schedule)$ {
        if ($mv_admin_allowed = 0) {
            return 403;
        }
        limit_req zone=mv_admin burst=20 nodelay;
        # 立即抓取最长约 magma.timeout + 10s；Cloudflare 等待源站响应的上限为 100s。
        proxy_read_timeout 95s;
        proxy_pass http://magma_viewer;
    }

    # 其余接口（列表、退出登录）。响应带 Cache-Control: no-store，不会被 Cloudflare 缓存。
    location /api/ {
        limit_req zone=mv_api burst=30 nodelay;
        proxy_pass http://magma_viewer;
    }

    # 打包下载：边打包边输出，关闭缓冲；限制频率与并发。
    location = /download/all {
        if ($mv_admin_allowed = 0) {
            return 403;
        }
        limit_req  zone=mv_zip burst=2 nodelay;
        limit_conn mv_conn 2;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://magma_viewer;
    }

    location = /download/zip {
        limit_req  zone=mv_zip burst=4 nodelay;
        limit_conn mv_conn 3;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://magma_viewer;
    }

    # 原图、缩略图、预览图、单张下载：文件名含 md5，内容不变，由 Cloudflare 缓存（见 README 缓存规则）。
    location ~ ^/(img|thumb|preview|download)/ {
        proxy_pass http://magma_viewer;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://magma_viewer;
    }

    location / {
        proxy_pass http://magma_viewer;
    }
}
