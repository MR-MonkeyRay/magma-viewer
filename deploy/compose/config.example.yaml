# 完整配置样例。复制为同目录的 config.yaml 后修改。

listen: ":8080"

admin:
  username: admin
  password: "change-me"
  # 留空则每次启动随机生成，重启后需重新登录
  session_secret: ""
  session_ttl: 168h

magma:
  # 画板 ID 取自 magma 画板链接；接口会 302 跳转到渲染图片
  url: "https://magma.com/api/render/<画板ID>/jpg"
  # 只需 AUTH_TOKEN；程序会读取 JWT 过期时间，不足 7 天时告警
  cookie: "AUTH_TOKEN=<你的 token>"
  # 可选额外请求头
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
    # Referer: "https://magma.com/"
  timeout: 30s

# 标准 5 段 crontab（分 时 日 月 周）；也支持 "@every 30s"、"@hourly"
# 示例："*/5 * * * *" 每 5 分钟，"0 * * * *" 每小时整点
schedule: "* * * * *"

storage:
  # 容器内路径，compose 中挂载到宿主机
  dir: /data/images
  # 下载临时目录
  temp_dir: /tmp