# 完整配置样例。复制为同目录的 config.yaml 后修改。

listen: ":8080"

# 可信反向代理（IP 或 CIDR），只采用这些来源转发的 X-Real-IP 作为客户端地址（用于登录限流）。
# 不设置时信任本机和内网地址；端口直接暴露给不可信网络时，建议只列出实际的代理地址。
# trusted_proxies: ["172.16.0.0/12"]

admin:
  username: admin
  password: "change-me"  # 必须修改：保留示例值会拒绝启动
  # 留空则每次启动随机生成，重启后需重新登录
  session_secret: ""
  session_ttl: 168h

magma:
  # 以下旧配置项仅用于首次升级迁移；迁移后由管理后台管理，并应从 config.yaml 删除。
  # url: "https://magma.com/..."
  # cookie: "..."
  # 可选额外请求头，所有画板共用；Cookie 请求头会被忽略，请在管理后台更新 Cookie。
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
    # Referer: "https://magma.com/"
  timeout: 30s

# 全局默认抓取计划；可在管理后台为单个画板设置不同频率。
# 标准 5 段 crontab（分 时 日 月 周）；也支持 "@every 30s"、"@hourly"
# 示例："*/5 * * * *" 每 5 分钟，"0 * * * *" 每小时整点
schedule: "* * * * *"

storage:
  # 容器内路径，compose 中挂载到宿主机；其下包含各画板目录 boards/、归档包 archives/ 和运行状态 .state/
  dir: /data/images
  # 下载临时目录
  temp_dir: /tmp
# 可选：告警 webhook。Cookie 7 天内过期（每天一次）、连续 3 次抓取失败、恢复正常时 POST 通知。
# format 为 json（默认，{"event","title","message","time"}）或 text（纯文本“标题\n内容”，适合 ntfy 等）。
# notify:
#   webhook: "https://ntfy.sh/<你的主题>"
#   format: text
