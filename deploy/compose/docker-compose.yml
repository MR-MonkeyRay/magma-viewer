# 使用 GitHub 工作流构建的镜像部署；配置与数据位于本目录。
# 镜像默认 latest，可在本目录 .env 中设置 MAGMA_VIEWER_TAG=0.1.1 固定版本。
name: magma-viewer

services:
  magma-viewer:
    container_name: magma-viewer
    image: ghcr.io/mr-monkeyray/magma-viewer:${MAGMA_VIEWER_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./images:/data/images