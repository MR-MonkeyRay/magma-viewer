# 使用 GitHub 工作流构建的镜像部署；配置与数据位于本目录。
# 镜像默认 latest，可在本目录 .env 中设置 MAGMA_VIEWER_TAG=<版本> 固定到所需的已发布版本。
name: magma-viewer

services:
  magma-viewer:
    container_name: magma-viewer
    image: ghcr.io/mr-monkeyray/magma-viewer:${MAGMA_VIEWER_TAG:-latest}
    restart: unless-stopped
    # 加固：根文件系统只读（仅 /data/images 与 /tmp 可写），禁止提权，移除全部 Linux 能力。
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 容器以 root 运行；需保留 DAC_OVERRIDE，才能写入属主非 root 的 images 目录，并读取仅属主可读的 config.yaml。
    # 若 images 目录与 config.yaml 的属主均为 root，可删除下方的 cap_add 及其列表项。
    cap_add:
      - DAC_OVERRIDE
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./images:/data/images