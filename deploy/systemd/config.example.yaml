# Linux systemd 配置样例；安装脚本只在首次安装时创建 config.yaml。
# 默认监听本机；公网访问建议通过带 HTTPS 的反向代理。
listen: "127.0.0.1:8080"

# 可信反向代理（IP 或 CIDR），只采用这些来源转发的 X-Real-IP；不设置时信任本机和内网地址。
# trusted_proxies: ["127.0.0.1", "::1"]

admin:
  username: admin
  # 安装脚本自动替换为随机密码，可在安装后的 config.yaml 中查看、修改。
  password: "change-me"
  session_secret: ""
  session_ttl: 168h

magma:
  url: "https://magma.com/api/render/<画板ID>/jpg"
  cookie: "AUTH_TOKEN=<你的 token>"
  headers:
    User-Agent: "Mozilla/5.0"
  timeout: 30s

# 标准 5 段 crontab；执行时区由 service 中的 TZ 决定。
schedule: "* * * * *"

storage:
  # systemd 只允许在 /var/lib/magma-viewer 和私有 /tmp 内写入。
  dir: /var/lib/magma-viewer/images
  temp_dir: /tmp

# 可选：告警 webhook。Cookie 7 天内过期（每天一次）、连续 3 次抓取失败、恢复正常时 POST 通知。
# format 为 json（默认，{"event","title","message","time"}）或 text（纯文本“标题\n内容”，适合 ntfy 等）。
# notify:
#   webhook: "https://ntfy.sh/<你的主题>"
#   format: text
