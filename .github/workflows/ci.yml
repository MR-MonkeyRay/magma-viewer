name: CI

# Pull requests run it directly; the image and release workflows call it and publish only after it passes.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up module Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race ./...

      # Both tools are built with the module's toolchain: a prebuilt binary from an older Go cannot read this
      # module's export data.
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The page has no build step, so a syntax error would otherwise first show up in a browser.
      - name: Check page script syntax
        run: for f in web/*.js; do node --check "$f"; done

      - name: Check shell scripts
        run: shellcheck build/package.sh deploy/systemd/install.sh deploy/nginx/update-cloudflare-ips.sh
