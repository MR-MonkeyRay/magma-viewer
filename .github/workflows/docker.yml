name: Publish Docker image

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # main: the VERSION tag is pushed once and never replaced; latest follows every main commit unless VERSION
      # is a prerelease. Other branches: one tag per commit.
      - name: Prepare image tags
        id: metadata
        shell: bash
        run: |
          version=$(<VERSION)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          release='' latest=false branch_tag=''
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            release=${version//+/_} # Docker tags cannot hold "+"; "_" cannot occur in a SemVer, so tags stay distinct
            [[ "${version%%+*}" == *-* ]] || latest=true
          else
            branch=$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C sed -E 's/[^a-zA-Z0-9_.-]+/-/g; s/^[.-]+//')
            branch="${branch:0:120}"
            branch_tag="${branch:-branch}-${GITHUB_SHA:0:7}"
          fi
          {
            echo "version=$version"
            echo "image=$image"
            echo "release=$release"
            echo "latest=$latest"
            echo "branch_tag=$branch_tag"
          } >> "$GITHUB_OUTPUT"

      # Ask the registry itself: the packages REST API lists only public packages of a personal account, so a
      # private image would look empty and its VERSION tag would be pushed again. Only a 404 counts as missing.
      - name: Choose tags to push
        id: tags
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.metadata.outputs.image }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release }}
          LATEST: ${{ steps.metadata.outputs.latest }}
          BRANCH_TAG: ${{ steps.metadata.outputs.branch_tag }}
        run: |
          repo=${IMAGE#ghcr.io/}
          token=$(curl -fsS -u "$GITHUB_ACTOR:$GHCR_TOKEN" "https://ghcr.io/token?scope=repository:$repo:pull" | jq -er .token)
          exists() {
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' --head -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/$repo/manifests/$1")
            case $code in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::error::Checking $IMAGE:$1 returned HTTP $code" >&2; exit 1 ;;
            esac
          }
          tags=()
          if [[ -n "$BRANCH_TAG" ]]; then
            exists "$BRANCH_TAG" || tags+=("$BRANCH_TAG")
          else
            exists "$RELEASE_TAG" || tags+=("$RELEASE_TAG")
            if [[ "$LATEST" == true ]]; then tags+=(latest); fi
          fi
          if ((${#tags[@]})); then build=true; echo "Pushing: ${tags[*]}"; else build=false; echo 'Nothing to push: the tags already exist.'; fi
          {
            echo "build=$build"
            echo "refs<<EOF"
            printf '%s\n' "${tags[@]/#/$IMAGE:}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.tags.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.tags.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      # The build stage cross-compiles on the runner's own architecture and the final stage only copies files,
      # so both platforms build without emulation.
      - name: Build and push image
        if: steps.tags.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.refs }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
