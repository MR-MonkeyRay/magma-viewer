name: Publish Docker image

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare image tag
        id: metadata
        shell: bash
        run: |
          version=$(<VERSION)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            tags=("$version" "latest")
          else
            branch=$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C sed -E 's/[^a-zA-Z0-9_.-]+/-/g; s/^[.-]+//')
            branch="${branch:0:120}"
            tags=("${branch:-branch}-${GITHUB_SHA:0:7}")
          fi
          {
            echo "version=$version"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "refs<<EOF"
            printf '%s\n' "${tags[@]/#/$image:}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether image exists
        id: exists
        uses: actions/github-script@v7
        env:
          TARGET_TAGS: ${{ steps.metadata.outputs.tags }}
        with:
          script: |
            const targets = process.env.TARGET_TAGS.split('\n').map(tag => tag.trim()).filter(Boolean);
            const ownerType = context.payload.repository.owner.type === 'Organization' ? 'orgs' : 'users';
            const route = `GET /${ownerType}/{owner}/packages/container/{package_name}/versions`;
            const present = new Set();
            try {
              for await (const {data} of github.paginate.iterator(route, {
                owner: context.repo.owner,
                package_name: context.repo.repo.toLowerCase(),
                per_page: 100,
              })) {
                for (const version of data) {
                  for (const tag of version.metadata.container.tags) present.add(tag);
                }
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const missing = targets.filter(tag => !present.has(tag));
            core.setOutput('exists', String(missing.length === 0));
            core.info(missing.length === 0 ? 'All target tags already exist; skipping build and push.' : `Missing tags: ${missing.join(', ')}; building.`);

      - name: Log in to GHCR
        if: steps.exists.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.refs }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
