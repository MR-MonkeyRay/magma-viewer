name: Publish Docker image

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare image tag
        id: metadata
        shell: bash
        run: |
          version=$(<VERSION)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            tag="$version"
          else
            branch=$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C sed -E 's/[^a-zA-Z0-9_.-]+/-/g; s/^[.-]+//')
            branch="${branch:0:120}"
            tag="${branch:-branch}-${GITHUB_SHA:0:7}"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "image=$image:$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether image exists
        id: exists
        uses: actions/github-script@v7
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
        with:
          script: |
            const ownerType = context.payload.repository.owner.type === 'Organization' ? 'orgs' : 'users';
            const route = `GET /${ownerType}/{owner}/packages/container/{package_name}/versions`;
            let exists = false;
            try {
              for await (const {data} of github.paginate.iterator(route, {
                owner: context.repo.owner,
                package_name: context.repo.repo.toLowerCase(),
                per_page: 100,
              })) {
                if (data.some(version => version.metadata.container.tags.includes(process.env.IMAGE_TAG))) {
                  exists = true;
                  break;
                }
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('exists', String(exists));
            core.info(exists ? 'Image tag already exists; skipping build and push.' : 'Image tag does not exist; building.');

      - name: Log in to GHCR
        if: steps.exists.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.image }}
          labels: |
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
